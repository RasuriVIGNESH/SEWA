spring.application.name=sewa

server.port=4354

# ?? DATABASE ??????????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable open-in-view to avoid lazy-load issues (use FETCH JOINs in queries instead)
spring.jpa.open-in-view=false

# ?? FHIR ??????????????????????????????????????????????????????????????????????
fhir.server.url=${FHIR_SERVER_URL:http://localhost:8081/fhir}

# Vitals poll interval ? change freely during development (milliseconds)
# 2000  = 2 seconds  (dev / fast testing)
# 5000  = 5 seconds  (default)
# 10000 = 10 seconds (light load)
fhir.poll.interval-ms=3000

# FHIR client socket timeouts (ms) ? prevents startup hanging when ICU is offline
fhir.client.socket-timeout=5000
fhir.client.connection-timeout=3000

# ?? JWT ???????????????????????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET:JWT_SECRET_KEY}
jwt.expiry-ms=86400000

# ?? WEBSOCKET ?????????????????????????????????????????????????????????????????
spring.websocket.max-text-message-size=65536

# ?? KAFKA ?????????????????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=${KAFKA_SERVER:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ?? LOGGING ???????????????????????????????????????????????????????????????????
logging.level.com.vig.sewa_backend=INFO
logging.level.ca.uhn.fhir=WARN