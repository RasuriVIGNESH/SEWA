spring.application.name=sewa

server.port=4354

# ?? DATABASE ??????????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

fhir.server.url=${FHIR_SERVER_URL:http://localhost:8081/fhir}
fhir.poll.interval-ms=3000

fhir.client.socket-timeout=5000
fhir.client.connection-timeout=3000

jwt.secret=${JWT_SECRET_KEY:JWT_SECRET_KEY}
jwt.expiry-ms=86400000

spring.websocket.max-text-message-size=65536

spring.kafka.bootstrap-servers=${KAFKA_SERVER:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.com.vig.sewa_backend=INFO
allowed_origins=${FRONTEND_URL:http://localhost:3000}

logging.level.ca.uhn.fhir=WARN